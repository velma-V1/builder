# Builder configuration — single source of truth for launcher-consumed settings.
#
# The launcher and managed-integration control plane validate these values at startup.

wsl:
  distribution: Ubuntu

repository:
  # Path to this repository, as seen from inside the configured WSL distribution.
  path: /home/xxthatguyxx/builder

database:
  # Relative to repository.path unless given as an absolute path.
  path: runtime.db

ports:
  read_api: 8000
  orchestrator_api: 8100
  dashboard: 1420

browser:
  auto_open: true

integrations:
  state_path: integrations.db
  agent_zero:
    enabled: false
    release: v2.7
    commit: 87e1e591e1ba2e8b1a19d34e134fcae490c8dded
    image: agent0ai/agent-zero:v2.7
    port: 50080
    cpu_millis: 2000
    memory_mb: 4096
    timeout_s: 900
  worldmonitor:
    enabled: false
    release: v2.5.23
    commit: e51058e1765ef2f0c83ccb1d08d984bc59d23f10
    source: https://github.com/koala73/worldmonitor.git
    port: 3000
    cpu_millis: 1000
    memory_mb: 2048
    timeout_s: 120
