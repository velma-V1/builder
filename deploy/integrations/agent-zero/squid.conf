acl gateway dstdomain host.docker.internal
acl gateway_port port 8100
http_access allow gateway gateway_port
http_access deny all
http_port 3128
# host-gateway (host.docker.internal) is reachable only via its IPv4 address on
# this Docker Desktop engine; prefer IPv4 so squid does not try the unroutable
# IPv6 host-gateway mapping and fail with ERR_CONNECT_FAIL/503.
cache deny all
cache deny all
access_log stdio:/dev/stdout
