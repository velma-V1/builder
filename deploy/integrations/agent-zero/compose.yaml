services:
  agent-zero:
    profiles: [builder-enabled]
    build:
      context: https://github.com/agent0ai/agent-zero.git#87e1e591e1ba2e8b1a19d34e134fcae490c8dded
      dockerfile: docker/run/Dockerfile
      labels:
        org.opencontainers.image.revision: 87e1e591e1ba2e8b1a19d34e134fcae490c8dded
    image: builder/agent-zero:v2.7-87e1e591
    container_name: builder-agent-zero
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${AGENT_ZERO_MEMORY:-4096m}
    cpus: ${AGENT_ZERO_CPUS:-2.0}
    restart: "no"
    environment:
      A0_SET_mcp_server_token: ${BUILDER_AGENT_ZERO_API_KEY:?runtime Agent Zero credential required}
      A0_SET_chat_model_provider: openai
      A0_SET_chat_model_name: ${AGENT_ZERO_MODEL:?selected Builder model required}
      A0_SET_chat_model_api_base: http://host.docker.internal:8100/api/integrations/model/v1
      A0_SET_litellm_global_kwargs: '{"stream":false}'
      API_KEY_OPENAI: ${BUILDER_MODEL_GATEWAY_TOKEN:?runtime model gateway credential required}
      HTTP_PROXY: http://agent-zero-egress:3128
      NO_PROXY: 127.0.0.1,localhost
    ports: ["127.0.0.1:${AGENT_ZERO_PORT:-50080}:80"]
    volumes: ["agent-zero-data:/a0/usr"]
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /a0/tmp:size=512m,mode=1777
    networks: [agent-zero-internal]
    depends_on:
      agent-zero-egress:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 30s

  agent-zero-egress:
    profiles: [builder-enabled]
    image: ubuntu/squid:6.13-25.10_beta
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.15
    volumes: ["./squid.conf:/etc/squid/squid.conf:ro"]
    tmpfs:
      - /var/log/squid:size=8m,uid=13,gid=13
      - /var/spool/squid:size=8m,uid=13,gid=13
      - /run:size=4m
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [agent-zero-internal, agent-zero-gateway]

networks:
  agent-zero-internal:
    internal: true
  agent-zero-gateway:

volumes:
  agent-zero-data:
